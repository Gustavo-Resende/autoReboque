{{define "conteudo"}}
{{$c := .Cliente}}
<div class="cabecalho-pagina">
  <div>
    <p class="mudo pequeno"><a href="{{if $c.ID}}/clientes/{{$c.ID}}{{else}}/clientes{{end}}">‹ {{if $c.ID}}{{$c.Nome}}{{else}}Clientes{{end}}</a></p>
    <h1>{{if $c.ID}}Editar cliente{{else}}Novo cliente{{end}}</h1>
  </div>
</div>
{{with .Erro}}<div class="alerta erro" role="alert">{{.}}</div>{{end}}

<form method="post" action="{{if $c.ID}}/clientes/{{$c.ID}}{{else}}/clientes{{end}}" class="estreito-form" autocomplete="off">
  <section class="cartao">
    <h2>Identificação</h2>
    <div class="grade-campos-3">
      <div>
        <label for="tipo">Tipo</label>
        <select id="tipo" name="tipo">
          <option value="PF" {{if eq $c.Tipo "PF"}}selected{{end}}>Pessoa física</option>
          <option value="PJ" {{if eq $c.Tipo "PJ"}}selected{{end}}>Pessoa jurídica</option>
        </select>
      </div>
      <div class="col-2"><label for="nome">Nome / razão social *</label><input id="nome" name="nome" value="{{$c.Nome}}" required autofocus></div>
      <div><label for="documento">CPF / CNPJ</label><input id="documento" name="documento" value="{{$c.Documento}}" inputmode="numeric"></div>
      <div>
        <label for="categoria">Categoria</label>
        <select id="categoria" name="categoria">
          {{range .Categorias}}<option value="{{.}}" {{if eq . $c.Categoria}}selected{{end}}>{{.Rotulo}}</option>{{end}}
        </select>
      </div>
      {{if $c.ID}}
      <div>
        <label for="ativo">Situação</label>
        <select id="ativo" name="ativo">
          <option value="1" {{if $c.Ativo}}selected{{end}}>Ativo</option>
          <option value="0" {{if not $c.Ativo}}selected{{end}}>Inativo</option>
        </select>
      </div>
      {{end}}
    </div>
  </section>

  <section class="cartao">
    <h2>Contato</h2>
    <div class="grade-campos-3">
      <div><label for="telefone">Telefone / WhatsApp</label><input id="telefone" name="telefone" value="{{$c.Telefone}}" inputmode="tel"></div>
      <div class="col-2"><label for="email">E-mail</label><input id="email" name="email" value="{{$c.Email}}" inputmode="email"></div>
      <div class="col-2"><label for="endereco">Endereço</label><input id="endereco" name="endereco" value="{{$c.Endereco}}"></div>
      <div><label for="cidade">Cidade</label><input id="cidade" name="cidade" value="{{$c.Cidade}}"></div>
    </div>
  </section>

  <section class="cartao">
    <h2>Observações</h2>
    <label for="observacoes" class="oculto">Observações</label>
    <textarea id="observacoes" name="observacoes" rows="3" placeholder="Condições combinadas, contato preferido, frota…">{{$c.Observacoes}}</textarea>
  </section>

  <div class="acoes">
    <button type="submit" class="botao primario grande">{{if $c.ID}}Salvar{{else}}Cadastrar cliente{{end}}</button>
    <a class="botao" href="{{if $c.ID}}/clientes/{{$c.ID}}{{else}}/clientes{{end}}">Cancelar</a>
  </div>
</form>
{{end}}
